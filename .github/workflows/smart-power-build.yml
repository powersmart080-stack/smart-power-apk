
name: Build SMART POWER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/smartpower/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SMART POWER"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.smartpower.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.smartpower.app"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="SMART POWER">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/smartpower/app/MainActivity.kt <<'EOF'
          package com.smartpower.app

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var webView: WebView

              private val appUrl =
                  "https://script.google.com/macros/s/AKfycby0EmtLgyWIAN9t9u5go38r6IJng628RzGNDmrc-TI7wMSWFuuiNzd0IyuanhIzov3-/exec"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.databaseEnabled = true

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance()
                      .setAcceptThirdPartyCookies(webView, true)

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  setContentView(webView)

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState)
                  } else {
                      webView.loadUrl(appUrl)
                  }
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-POWER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
